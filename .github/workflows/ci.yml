name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check deployment scripts
        run: |
          bash -n ops/ekiden-deploy ops/ekiden-ssh-command
          python3 tests/deployment_test.py
      - name: Verify Docker build
        run: docker build -t ekiden-ci:${{ github.sha }} .
