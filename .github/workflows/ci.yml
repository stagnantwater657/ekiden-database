name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install browser for navigation tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check deployment scripts
        run: |
          bash -n ops/ekiden-ssh-command ops/runner-transfer.sh
          python3 -m py_compile ops/ekiden-deploy ops/image-metadata.py ops/transfer-log.py
          sudo visudo -cf ops/ekiden-deploy.sudoers
          python3 tests/deployment_test.py
          python3 tests/transfer_diagnostics_test.py
      - name: Verify Docker build
        run: docker build -t ekiden-ci:${{ github.sha }} .
  docker29-containerd:
    name: Docker 29.1.3 containerd archive compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # A separate disposable CI daemon, never the Ubuntu production daemon.
      - name: Set up isolated Docker 29 containerd image store
        id: docker
        uses: docker/setup-docker-action@v4
        with:
          version: v29.1.3
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Check storage mode and build fixture
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker version --format '{{.Server.Version}}' | grep '^29\.1\.3$'
          docker info --format '{{json .DriverStatus}}' | grep -F 'io.containerd.snapshotter.v1'
          docker build --label "org.opencontainers.image.revision=$IMAGE_SHA" \
            -t "ghcr.io/stagnantwater657/ekiden-database:$IMAGE_SHA" .
      - name: Test archive import and loaded application
        env:
          EKIDEN_DOCKER_TEST: "1"
          DOCKER_TEST_SOCKET: ${{ steps.docker.outputs.sock }}
          IMAGE_SHA: ${{ github.sha }}
        run: python3 tests/docker_archive_test.py "$IMAGE_SHA"
  cos-benchmark-tests:
    name: COS benchmark offline SDK tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements-cos-benchmark.txt
      - run: python -m pip install --disable-pip-version-check --timeout 15 --retries 1 -r ops/requirements-cos-benchmark.txt
      - run: python -m py_compile ops/cos-speed-test.py
      # All HTTP responses are synthetic, with socket connections forbidden.
      # No COS Secrets are provided to PR tests.
      - run: python tests/cos_benchmark_test.py
  source-deployment:
    name: Source deployment policy and resource limits
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Offline source deployment tests
        run: |
          python3 tests/source_deployment_test.py
          python3 tests/source_download_test.py
          python3 tests/bootstrap_docs_test.py
          node --test tests/npm_lock.test.mjs
          python3 -m py_compile ops/source-policy.py ops/ekiden-source.py
          bash -n ops/runner-source.sh
      - name: Set up disposable Docker 29 daemon
        id: docker
        uses: docker/setup-docker-action@v4
        with:
          version: v29.1.3
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Verify actual limits, OOM protection and application build
        env:
          EKIDEN_DOCKER_TEST: "1"
          DOCKER_TEST_SOCKET: ${{ steps.docker.outputs.sock }}
        run: python3 tests/source_resource_docker_test.py
