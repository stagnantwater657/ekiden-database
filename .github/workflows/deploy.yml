name: Deploy Ekiden (manual)
on:
  workflow_dispatch:
    inputs:
      upload_only:
        description: Verify upload/import only; do not update the running website
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ekiden-production
  cancel-in-progress: false
jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run lint && npm test
      - run: python3 tests/deployment_test.py
      - uses: docker/setup-buildx-action@v3
      - name: Build a single-platform image on the runner
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          provenance: false
          platforms: linux/amd64
          tags: ghcr.io/stagnantwater657/ekiden-database:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/stagnantwater657/ekiden-database
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Export and compress the local image
        id: archive
        timeout-minutes: 8
        shell: bash
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/stagnantwater657/ekiden-database:$IMAGE_SHA"
          mkdir -m 700 "$RUNNER_TEMP/ekiden-image"
          docker image save "$image" | gzip -1 -n > "$RUNNER_TEMP/ekiden-image/image.tar.gz"
          test -s "$RUNNER_TEMP/ekiden-image/image.tar.gz"
          python3 ops/image-metadata.py "$RUNNER_TEMP/ekiden-image/image.tar.gz" "$IMAGE_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload, verify, import and activate Ekiden
        timeout-minutes: 47
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE_SHA: ${{ github.sha }}
          CONFIG_DIGEST: ${{ steps.archive.outputs.config_digest }}
          UPLOAD_ONLY: ${{ inputs.upload_only }}
        run: |
          if [[ "$UPLOAD_ONLY" == true ]]; then
            ops/runner-transfer.sh "$RUNNER_TEMP/ekiden-image/image.tar.gz" --upload-only
          else
            ops/runner-transfer.sh "$RUNNER_TEMP/ekiden-image/image.tar.gz"
          fi
      - name: Remove runner archive
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/ekiden-image"
